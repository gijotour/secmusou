<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>보안무쌍</title>
<meta name="description" content="보안담당자를 위한 스트레스 해소 + 보안 학습 무쌍 액션 게임">
<!-- 홈 화면 앱(PWA) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05070d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="보안무쌍">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  :root { --bg: #05070d; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  canvas { display: block; outline: none; position: absolute; left: 0; top: 0; width: 100%; height: 100%; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #gl { z-index: 0; display: none; }
  #game { z-index: 1; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="game" tabindex="0" aria-label="보안무쌍 게임 화면"></canvas>
<!-- 3D: Three.js r128 (프로젝트에 포함 → 오프라인에서도 3D). 없으면 자동으로 2D 모드 -->
<script src="vendor/three.min.js"></script>
<script src="content.js"></script>
<script src="game.js"></script>
<script src="render3d.js"></script>
<script>
  // 오프라인 실행용 서비스 워커 (http/https에서만. 파일로 직접 열면 생략)
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
</script>
</body>
</html>
