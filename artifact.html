<title>보안무쌍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  /* 단일 다크 화면(관제실) 게임: 테마 전환 없이 항상 어두운 배경 */
  :root { color-scheme: dark; --bg: #05070d; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); overflow: hidden; }
  canvas { display: block; outline: none; position: absolute; left: 0; top: 0; width: 100%; height: 100%; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #gl { z-index: 0; display: none; }
  #game { z-index: 1; }
</style>
<canvas id="gl"></canvas>
<canvas id="game" tabindex="0" aria-label="보안무쌍 게임 화면 — 키보드로 조작합니다"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="content.js"></script>
<script src="game.js"></script>
<script src="render3d.js"></script>
